name: Bygg och publicera release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checka ut kod
        uses: actions/checkout@v4

      - name: Sätt upp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installera beroenden
        run: npm install

      - name: Bygg och publicera
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
