name: Bygg och publicera release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checka ut kod
        uses: actions/checkout@v4

      - name: Sätt upp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installera beroenden
        run: npm install

      - name: Synka package.json version mot taggen
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/v', ''
          Write-Host "Tag-version: $tag"
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne $tag) {
            Write-Host "Skriver om package.json version: $($pkg.version) -> $tag"
            $pkg.version = $tag
            $pkg | ConvertTo-Json -Depth 100 | Set-Content package.json -Encoding utf8
          } else {
            Write-Host "package.json är redan i synk."
          }

      - name: Bygg och publicera
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
